name: Node.js Build Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Gunakan versi v5 untuk actions/checkout
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Gunakan versi v5 untuk actions/setup-node dan perbarui versi Node ke 22 atau 24
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22 # Atau gunakan 24 sesuai kebutuhan proyek
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build script
        run: npm run build
